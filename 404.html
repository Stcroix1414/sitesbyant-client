<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Sites by Ant Demo Showroom</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#22303c;--ink-soft:#4a5a68;--paper:#fcfcfa;--line:#d8d4ca;--green:#1e6f50;--green-dark:#175a41;--brass:#b98a2f}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Public Sans',-apple-system,sans-serif;color:var(--ink);background:var(--paper);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;
  }
  .num{font-family:'Bitter',serif;font-weight:700;font-size:5rem;color:var(--green);line-height:1}
  h1{font-family:'Bitter',serif;font-size:1.5rem;margin:10px 0 8px}
  p{color:var(--ink-soft);max-width:34em;margin:0 auto 24px}
  .btn{
    display:inline-block;background:var(--green);color:#fff;text-decoration:none;
    font-weight:600;padding:13px 22px;border-radius:5px;
  }
  .btn:hover{background:var(--green-dark)}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}
</style>
</head>
<body>
<div>
  <div class="num">404</div>
  <h1>That page isn't on the board</h1>
  <p>The demo you're looking for may have moved when the showroom was reorganized. Everything that exists is one click away.</p>
  <a class="btn" href="/">Back to the showroom</a>
</div>
</body>
</html>
